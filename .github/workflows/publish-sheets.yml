name: Publish site

# data.js is pushed by the log sheet's Apps Script (integrations/sheet-sync.gs);
# every push to main republishes the site. No secrets are needed here.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: memories-pages
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Check website behavior
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Install image build tools
        run: python3 -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Package site
        run: python3 scripts/package_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
